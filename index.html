<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청원학교 데이터 라벨링</title>
<style>
:root{--ink:#1d2433;--mute:#5a6475;--bg:#f4f7fb;--card:#fff;--line:#d5dce8;--pri:#1f6feb;--pri2:#0f4fb8;--ok:#1a8f4c;--warn:#c9680a;--bad:#c23a3a;--teal:#0e8a8a;--gt:#00b3a4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:19px;line-height:1.55}
button{font:inherit;cursor:pointer}
.top{background:#12306b;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top b{font-size:21px}
.top .sub{opacity:.85;font-size:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dots button{width:36px;height:36px;border-radius:50%;border:2px solid #7ea4ee;background:transparent;color:#fff;font-weight:700;font-size:16px}
.dots button.on{background:#fff;color:#12306b;border-color:#fff}
.dots button.done{background:#2fb872;border-color:#2fb872;color:#fff}
.dots button.on.done{background:#fff;color:#12306b}
main{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:28px;margin:6px 0 4px}
h2{font-size:23px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
.how{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.how{grid-template-columns:1fr}}
.how div{border-radius:12px;padding:10px 14px;background:#eef4ff}
.how div.use{background:#fff6e5}
.how small{display:block;font-weight:700;color:var(--mute);font-size:15px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:900px){.work{grid-template-columns:1fr}}
.stagewrap{background:#0b1220;border-radius:14px;padding:8px}
.stage{position:relative;width:100%;margin:0 auto;user-select:none;-webkit-user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage svg{touch-action:none;cursor:crosshair}
.stage canvas{pointer-events:none}
.side .btn{display:block;width:100%;margin:8px 0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:#e4eaf5;color:var(--ink);min-height:50px}
.btn:hover{background:#d6dff0}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;min-height:46px}
.chip.on{border-color:var(--pri);background:#e6f0ff;color:var(--pri2)}
.chip .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.chip.right{border-color:var(--ok);background:#e5f6ec}
.chip.wrong{border-color:var(--bad);background:#fdeaea}
.prompt{background:#fff9e8;border:2px solid #f2d27a;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:10px}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;background:#eefaf3;border:2px solid #9ad7b4}
.fb.low{background:#fff4e6;border-color:#f0c48a}
.stars{font-size:34px;letter-spacing:4px;color:#f5a400}
.stars i{color:#cfd6e2;font-style:normal}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.pcard img{width:100%;height:170px;object-fit:cover;border-radius:10px;display:block;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.cert{border:4px double #1f4aa8;border-radius:16px;padding:22px;text-align:center;background:#fffdf5}
.cert h2{font-size:30px;color:#1f4aa8}
.note{font-size:15px;color:var(--mute)}
.tag{display:inline-block;background:#eef2f9;border-radius:8px;padding:2px 8px;font-size:15px;margin:2px}
.welcome{max-width:700px;margin:40px auto}
input[type=text]{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;width:100%}
.side .btn.on{background:#dbe8ff;color:var(--pri2)}
.sizebtn{display:flex;gap:8px}.sizebtn .btn{flex:1;margin:0}
.sizebtn .btn.on{background:var(--pri);color:#fff}
@media print{.top,.noprint{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>

/* ---------- 도구 함수 ---------- */
function stars(n){ return '<span class="stars">'+'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i></span>'; }
function starsOf(score, th){ return score>=th[0]?3:score>=th[1]?2:score>=th[2]?1:0; }
function msg(n){ return ['아직은 많이 달라요. 정답을 보고 다시 해 볼까요?','조금 아쉬워요. 가장자리를 더 맞춰 봐요.','꽤 잘했어요! 조금만 더 다듬어 봐요.','정확해요! AI가 잘 배우겠어요.'][n]; }
function iouBox(a,b){
  var x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[2],b[2]),y2=Math.min(a[3],b[3]);
  var i=Math.max(0,x2-x1)*Math.max(0,y2-y1), u=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-i;
  return u>0? i/u : 0;
}
function maskOf(poly, W, H){
  var c=document.createElement('canvas'); c.width=W; c.height=H; var g=c.getContext('2d');
  g.fillStyle='#000'; g.beginPath(); poly.forEach(function(p,i){ i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); }); g.closePath(); g.fill();
  return g.getImageData(0,0,W,H).data;
}
function iouMask(a,b){ var i=0,u=0; for(var k=3;k<a.length;k+=4){ var x=a[k]>100,y=b[k]>100; if(x&&y)i++; if(x||y)u++; } return u? i/u : 0; }
function segDist(p,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0; t=Math.max(0,Math.min(1,t));
  var x=a[0]+t*dx,y=a[1]+t*dy; return Math.hypot(p[0]-x,p[1]-y);
}
function distToLine(p,L){ var m=1e9; for(var i=0;i<L.length-1;i++) m=Math.min(m,segDist(p,L[i],L[i+1])); return m; }
function sampleLine(L,step){
  var out=[]; for(var i=0;i<L.length-1;i++){ var a=L[i],b=L[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step)); for(var k=0;k<n;k++) out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]); }
  out.push(L[L.length-1]); return out;
}

function scalePoly(P,k){ var cx=0,cy=0; P.forEach(function(p){cx+=p[0];cy+=p[1];}); cx/=P.length; cy/=P.length; return P.map(function(p){return [Math.max(4,Math.min(636,cx+(p[0]-cx)*k)), Math.max(4,Math.min(423,cy+(p[1]-cy)*k))];}); }
function padBox(b,k,sz){ var w=b[2]-b[0],h=b[3]-b[1],px=w*k,py=h*k; return [Math.max(3,b[0]-px),Math.max(3,b[1]-py),Math.min(sz[0]-3,b[2]+px),Math.min(sz[1]-3,b[3]+py)]; }
function hull(P){ var a=P.slice().sort(function(u,v){return u[0]-v[0]||u[1]-v[1];}); function cr(o,u,v){return (u[0]-o[0])*(v[1]-o[1])-(u[1]-o[1])*(v[0]-o[0]);} var lo=[],up=[],i; for(i=0;i<a.length;i++){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],a[i])<=0) lo.pop(); lo.push(a[i]); } for(i=a.length-1;i>=0;i--){ while(up.length>1&&cr(up[up.length-2],up[up.length-1],a[i])<=0) up.pop(); up.push(a[i]); } lo.pop(); up.pop(); return lo.concat(up); }

function bind(){}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],[data-cls1],[data-tag],[data-cls],[data-size]'); if(!t) return;
  if(t.hasAttribute('data-go')){ if(!S.started) return; go(Number(t.getAttribute('data-go'))); return; }
  if(t.hasAttribute('data-cls1')){ if(FB) return; var p=t.getAttribute('data-cls1').split(','); W.ans[p[0]]=Number(p[1]); render(); return; }
  if(t.hasAttribute('data-tag')){ if(FB) return; var i=t.getAttribute('data-tag'); W.sel[i]=!W.sel[i]; if(!W.sel[i]) delete W.sel[i]; render(); return; }
  if(t.hasAttribute('data-cls')){ W.cls=t.getAttribute('data-cls'); render(); return; }
  if(t.hasAttribute('data-size')){ W.size=Number(t.getAttribute('data-size')); render(); return; }
  var a=t.getAttribute('data-act');
  if(a==='start'){ var nm=document.getElementById('nm'); S.name=nm?nm.value.trim():''; S.started=true; S.t0=Date.now(); S.step=0; save(); resetWork(); render(); return; }
  if(a==='submit') return submit();
  if(a==='retry'){ resetWork(); render(); return; }
  if(a==='gt'){ SHOWGT=!SHOWGT; render(); return; }
  if(a==='undo') return undo();
  if(a==='clear'){ resetWork(); render(); return; }
  if(a==='closepoly'){ if(W.poly.length>=3){ W.closed=true; render(); } return; }
  if(a==='hint'){ HINT=!HINT; render(); return; }
  if(a==='eraser'){ W.eraser=!W.eraser; render(); return; }
  if(a==='print'){ window.print(); return; }
  if(a==='restart'){ S.res={}; S.started=false; S.step=0; S.t0=Date.now(); save(); resetWork(); render(); return; }
  if(a==='export') return exportJson();
});
function undo(){
  if(FB) return; var id=STEPS[S.step].id;
  if(id==='pt') W.pts.pop();
  else if(id==='box1') W.box=null;
  else if(id==='box3'){ if(W.boxes[W.cls]) delete W.boxes[W.cls]; else { var k=Object.keys(W.boxes); if(k.length) delete W.boxes[k[k.length-1]]; } }
  else if(id==='poly1'||id==='poly2'){ if(W.closed) W.closed=false; else W.poly.pop(); }
  else if(id==='line') W.line.pop();
  else if(id==='brush'){ if(brushCanvas){ brushCanvas.getContext('2d').clearRect(0,0,brushCanvas.width,brushCanvas.height); } }
  render();
}

/* ---------- 마운트(마우스/터치) ---------- */
function mount(){
  var id=STEPS[S.step].id, svg=document.getElementById('ov'); if(!svg) return;
  var st=STEPS[S.step], sz=SIZE[st.img];
  if(id==='brush'){
    if(!brushCanvas){ brushCanvas=document.createElement('canvas'); brushCanvas.width=sz[0]; brushCanvas.height=sz[1]; }
    document.getElementById('stage').insertBefore(brushCanvas, svg);
  }
  drawOv();
  if(FB) return;
  function pt(ev){ var p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; var q=p.matrixTransform(svg.getScreenCTM().inverse()); return [Math.max(0,Math.min(sz[0],q.x)),Math.max(0,Math.min(sz[1],q.y))]; }
  var down=null;
  svg.addEventListener('pointerdown',function(ev){
    ev.preventDefault(); try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    var p=pt(ev);
    if(id==='pt'){ if(W.pts.length<3){ W.pts.push(p); render(); } return; }
    if(id==='line'){ W.line.push(p); render(); return; }
    if(id==='poly1'||id==='poly2'){
      if(W.closed) return;
      if(W.poly.length>=3){ var f=W.poly[0]; var r=Math.max(10,sz[0]*0.022); if(Math.hypot(p[0]-f[0],p[1]-f[1])<r){ W.closed=true; render(); return; } }
      W.poly.push(p); render(); return;
    }
    if(id==='box1'||id==='box3'){ down=p; W.tmp=[p[0],p[1],p[0],p[1]]; drawOv(); return; }
    if(id==='brush'){ W.drawing=true; paint(p); return; }
  });
  svg.addEventListener('pointermove',function(ev){
    var p=pt(ev);
    if((id==='box1'||id==='box3') && down){ W.tmp=[Math.min(down[0],p[0]),Math.min(down[1],p[1]),Math.max(down[0],p[0]),Math.max(down[1],p[1])]; drawOv(); }
    if(id==='brush'){ W.hover=p; if(W.drawing) paint(p); else drawOv(); }
    if(id==='poly1'||id==='poly2'||id==='line'){ W.hover=p; drawOv(); }
  });
  function up(){
    if((id==='box1'||id==='box3') && down){
      var b=W.tmp; down=null; W.tmp=null;
      if(b && b[2]-b[0]>8 && b[3]-b[1]>8){ if(id==='box1') W.box=b; else W.boxes[W.cls]=b; render(); } else drawOv();
    }
    if(id==='brush') W.drawing=false;
  }
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  svg.addEventListener('pointerleave',function(){ if(id==='brush'||id==='poly1'||id==='poly2'||id==='line'){ W.hover=null; drawOv(); } });
}
function paint(p){
  var g=brushCanvas.getContext('2d'), r=W.size*(brushCanvas.width/640)/1.0;
  if(W.eraser){ g.globalCompositeOperation='destination-out'; g.fillStyle='#000'; }
  else { g.globalCompositeOperation='source-over'; g.fillStyle='rgba(255,70,120,0.55)'; }
  var last=W.last;
  function dot(x,y){ g.beginPath(); g.arc(x,y,r/2,0,Math.PI*2); g.fill(); }
  if(last){ var d=Math.hypot(p[0]-last[0],p[1]-last[1]), n=Math.max(1,Math.ceil(d/(r/4))); for(var i=1;i<=n;i++) dot(last[0]+(p[0]-last[0])*i/n,last[1]+(p[1]-last[1])*i/n); } else dot(p[0],p[1]);
  W.last=W.drawing?p:null; drawOv();
}
document.addEventListener('pointerup',function(){ if(W) W.last=null; });

function drawOv(){
  var svg=document.getElementById('ov'); if(!svg) return;
  var id=STEPS[S.step].id, st=STEPS[S.step], sz=SIZE[st.img]||[600,400], s=sz[0]/640, h='';
  var vr=Math.max(5,sz[0]*0.011), sw=Math.max(2,sz[0]*0.0045);
  function dot(p,c,l){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+vr+'" fill="'+c+'" stroke="#fff" stroke-width="'+(sw*0.6)+'"/>'+(l?'<text x="'+(p[0]+vr+4)+'" y="'+(p[1]-vr)+'" font-size="'+(sz[0]*0.034)+'" font-weight="700" fill="#fff" stroke="#000" stroke-width="'+(sz[0]*0.006)+'" paint-order="stroke">'+l+'</text>':''); }
  function poly(P,c,close,fill){ if(!P.length) return ''; return '<'+(close?'polygon':'polyline')+' points="'+P.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="'+(fill||'none')+'" stroke="'+c+'" stroke-width="'+sw+'" stroke-linejoin="round"/>'; }
  var gt='#00e5cf';
  if(HINT){
    var hc='rgba(255,255,255,.55)', hs='stroke="'+hc+'" stroke-width="'+(sw*0.8)+'" fill="rgba(255,255,255,.06)"';
    var hr=function(b){ return '<rect x="'+b[0]+'" y="'+b[1]+'" width="'+(b[2]-b[0])+'" height="'+(b[3]-b[1])+'" rx="'+(sw*2)+'" '+hs+'/>'; };
    var hp=function(P){ return '<polygon points="'+P.map(function(p){return p[0]+','+p[1];}).join(' ')+'" stroke-linejoin="round" '+hs+'/>'; };
    if(id==='pt') GT.cat.pts.forEach(function(p){ h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(sz[0]*0.075)+'" '+hs+'/>'; });
    if(id==='box1') h+=hr(padBox(GT.moto.box,0.1,sz));
    if(id==='box3') h+=hr(padBox(GT.coffee.boxes.plate,0.08,sz));
    if(id==='poly1') h+=hp(scalePoly(hull(GT.flower.poly),1.22));
    if(id==='poly2') h+=hp(scalePoly(hull(GT.china.poly),1.15));
    if(id==='line'){ var L=GT.rocket.line; h+='<polyline points="'+L.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="'+(sz[0]*0.075)+'" stroke-linecap="round" stroke-linejoin="round"/><polyline points="'+L.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="none" stroke="'+hc+'" stroke-width="'+(sw*0.6)+'" stroke-opacity="0" />'; }
    if(id==='brush') h+=hp(scalePoly(hull(GT.coffee.surface),1.5));
  }
  if(id==='pt'){ var n=['왼쪽 눈','오른쪽 눈','코']; W.pts.forEach(function(p,i){ h+=dot(p,'#ff4d6d',n[i]); }); if(SHOWGT) GT.cat.pts.forEach(function(p,i){ h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(vr*1.8)+'" fill="none" stroke="'+gt+'" stroke-width="'+sw+'" stroke-dasharray="'+(sw*2)+'"/>'; }); }
  if(id==='box1'){ var b=W.tmp||W.box; if(b) h+='<rect x="'+b[0]+'" y="'+b[1]+'" width="'+(b[2]-b[0])+'" height="'+(b[3]-b[1])+'" fill="rgba(255,77,109,.18)" stroke="#ff4d6d" stroke-width="'+sw+'"'+(W.tmp?' stroke-dasharray="'+(sw*2.5)+'"':'')+'/>'; if(SHOWGT){ var g=GT.moto.box; h+='<rect x="'+g[0]+'" y="'+g[1]+'" width="'+(g[2]-g[0])+'" height="'+(g[3]-g[1])+'" fill="none" stroke="'+gt+'" stroke-width="'+sw+'" stroke-dasharray="'+(sw*3)+'"/>'; } }
  if(id==='box3'){
    var nm={cup:'컵',plate:'접시',spoon:'숟가락'};
    Object.keys(W.boxes).forEach(function(k){ var b=W.boxes[k]; h+='<rect x="'+b[0]+'" y="'+b[1]+'" width="'+(b[2]-b[0])+'" height="'+(b[3]-b[1])+'" fill="none" stroke="'+COLORS[k]+'" stroke-width="'+sw+'"/><text x="'+(b[0]+6)+'" y="'+(b[1]+sz[0]*0.04)+'" font-size="'+(sz[0]*0.04)+'" font-weight="700" fill="'+COLORS[k]+'" stroke="#000" stroke-width="'+(sz[0]*0.006)+'" paint-order="stroke">'+nm[k]+'</text>'; });
    if(W.tmp){ var b=W.tmp; h+='<rect x="'+b[0]+'" y="'+b[1]+'" width="'+(b[2]-b[0])+'" height="'+(b[3]-b[1])+'" fill="rgba(255,255,255,.12)" stroke="'+COLORS[W.cls]+'" stroke-width="'+sw+'" stroke-dasharray="'+(sw*2)+'"/>'; }
    if(SHOWGT) Object.keys(GT.coffee.boxes).forEach(function(k){ var g=GT.coffee.boxes[k]; h+='<rect x="'+g[0]+'" y="'+g[1]+'" width="'+(g[2]-g[0])+'" height="'+(g[3]-g[1])+'" fill="none" stroke="'+gt+'" stroke-width="'+sw+'" stroke-dasharray="'+(sw*3)+'"/>'; });
  }
  if(id==='poly1'||id==='poly2'){
    var P=W.poly; h+=poly(P,'#ff4d6d',W.closed,W.closed?'rgba(255,77,109,.25)':'none');
    if(!W.closed && P.length && W.hover){
      var L=P[P.length-1], hv=W.hover, dsh='stroke-dasharray="'+(sw*2.2)+' '+(sw*1.8)+'" stroke-linecap="round"';
      h+='<line x1="'+L[0]+'" y1="'+L[1]+'" x2="'+hv[0]+'" y2="'+hv[1]+'" stroke="#fff" stroke-width="'+sw+'" '+dsh+'/>';
      if(P.length>=2) h+='<line x1="'+hv[0]+'" y1="'+hv[1]+'" x2="'+P[0][0]+'" y2="'+P[0][1]+'" stroke="#ffd400" stroke-width="'+(sw*0.8)+'" '+dsh+' opacity=".85"/>';
    }
    P.forEach(function(p,i){ h+=dot(p, i===0?'#ffd400':'#ff4d6d'); });
    if(SHOWGT) h+=poly(GT[id==='poly1'?'flower':'china'].poly,gt,true,'rgba(0,229,207,.12)').replace('stroke-linejoin','stroke-dasharray="'+(sw*3)+'" stroke-linejoin');
  }
  if(id==='line'){ h+=poly(W.line,'#ff4d6d',false);
    if(W.line.length && W.hover && !FB){ var Ll=W.line[W.line.length-1]; h+='<line x1="'+Ll[0]+'" y1="'+Ll[1]+'" x2="'+W.hover[0]+'" y2="'+W.hover[1]+'" stroke="#fff" stroke-width="'+sw+'" stroke-dasharray="'+(sw*2.2)+' '+(sw*1.8)+'" stroke-linecap="round"/>'; } W.line.forEach(function(p){ h+=dot(p,'#ff4d6d'); }); if(SHOWGT) h+=poly(GT.rocket.line,gt,false).replace('stroke-linejoin','stroke-dasharray="'+(sw*3)+'" stroke-linejoin'); }
  if(id==='brush'){
    if(SHOWGT) h+=poly(GT.coffee.surface,gt,true,'rgba(0,229,207,.18)').replace('stroke-linejoin','stroke-dasharray="'+(sw*3)+'" stroke-linejoin');
    if(W.hover && !FB){ var r=W.size*s/2; h+='<circle cx="'+W.hover[0]+'" cy="'+W.hover[1]+'" r="'+r+'" fill="none" stroke="#fff" stroke-width="'+(sw*0.7)+'"/>'; }
  }
  svg.innerHTML=h;
}

/* ---------- 채점 ---------- */
function submit(){
  var id=STEPS[S.step].id, score=0, th=[.75,.5,.25], extra='';
  if(id==='cls'){ var ok=0; CLS.forEach(function(c,i){ if(W.ans[i]===c.ok) ok++; }); score=ok/4; th=[.99,.7,.4]; extra=ok+'/4 맞았어요.'; }
  else if(id==='tag'){ var tp=0,fp=0; TAGS.forEach(function(t,i){ if(W.sel[i]){ t[1]?tp++:fp++; } }); score=Math.max(0,(tp-fp)/5); th=[.99,.7,.4]; extra='맞게 고른 것 '+tp+'개, 잘못 고른 것 '+fp+'개'; }
  else if(id==='pt'){
    if(W.pts.length<3){ alert('점 3개를 모두 찍어 주세요.'); return; }
    var s=0; var errs=[]; GT.cat.pts.forEach(function(g,i){ var d=Math.hypot(W.pts[i][0]-g[0],W.pts[i][1]-g[1]); errs.push(Math.round(d)); s+=Math.max(0,1-d/55); }); score=s/3; th=[.75,.5,.25]; extra='정답과의 거리(칸): '+errs.join(', ');
  }
  else if(id==='box1'){ if(!W.box){ alert('먼저 네모를 그려 주세요.'); return; } score=iouBox(W.box,GT.moto.box); th=[.8,.6,.35]; extra='겹침 정도(IoU) '+score.toFixed(2); }
  else if(id==='box3'){
    var keys=['cup','plate','spoon']; if(!Object.keys(W.boxes).length){ alert('네모를 그려 주세요.'); return; }
    var t=0,det=[]; keys.forEach(function(k){ var v=W.boxes[k]?iouBox(W.boxes[k],GT.coffee.boxes[k]):0; t+=v; det.push({cup:'컵',plate:'접시',spoon:'숟가락'}[k]+' '+(W.boxes[k]?v.toFixed(2):'없음')); }); score=t/3; th=[.8,.6,.35]; extra=det.join(' · ');
  }
  else if(id==='poly1'||id==='poly2'){
    if(!W.closed){ if(W.poly.length>=3) W.closed=true; else { alert('점을 3개 이상 찍어 주세요.'); return; } }
    var sz=SIZE[STEPS[S.step].img], f=0.5, w=Math.round(sz[0]*f), hh=Math.round(sz[1]*f);
    var sc=function(P){ return P.map(function(p){return [p[0]*f,p[1]*f];}); };
    var g=GT[id==='poly1'?'flower':'china'].poly;
    score=iouMask(maskOf(sc(W.poly),w,hh),maskOf(sc(g),w,hh)); th=[.85,.65,.4]; extra='겹침 정도(IoU) '+score.toFixed(2)+' · 점 '+W.poly.length+'개';
  }
  else if(id==='line'){
    if(W.line.length<2){ alert('점을 2개 이상 눌러 주세요.'); return; }
    var G=sampleLine(GT.rocket.line,6), U=sampleLine(W.line,6), d1=0,d2=0; G.forEach(function(p){ d1+=distToLine(p,W.line); }); U.forEach(function(p){ d2+=distToLine(p,GT.rocket.line); });
    var d=(d1/G.length+d2/U.length)/2; score=Math.max(0,1-d/30); th=[.7,.45,.2]; extra='선이 정답에서 평균 '+d.toFixed(1)+' 칸 떨어져 있어요.';
  }
  else if(id==='brush'){
    var cv=brushCanvas, ctx=cv.getContext('2d'), a=ctx.getImageData(0,0,cv.width,cv.height).data;
    var any=false; for(var k=3;k<a.length;k+=4){ if(a[k]>60){ any=true; break; } } if(!any){ alert('먼저 색칠해 주세요.'); return; }
    var gm=maskOf(GT.coffee.surface,cv.width,cv.height), A=new Uint8ClampedArray(a.length);
    for(var k2=3;k2<a.length;k2+=4) A[k2]=a[k2]>60?255:0;
    score=iouMask(A,gm); th=[.75,.55,.3]; extra='겹침 정도(IoU) '+score.toFixed(2);
  }
  var n=starsOf(score,th); FB={score:score,stars:n,extra:extra}; SHOWGT=false;
  S.res[id]={score:score,stars:n,data:snapshot(id)}; save(); render();
}
function snapshot(id){
  if(id==='pt') return W.pts; if(id==='box1') return W.box; if(id==='box3') return W.boxes;
  if(id==='poly1'||id==='poly2') return W.poly; if(id==='line') return W.line;
  if(id==='cls') return W.ans; if(id==='tag') return Object.keys(W.sel);
  if(id==='brush') return 'mask';
  return null;
}
function exportJson(){
  var out={ labeler:S.name||'', exported:new Date().toISOString(), tasks:[] };
  STEPS.slice(0,9).forEach(function(s){ var r=S.res[s.id]; if(r) out.tasks.push({task:s.id,type:s.kind,image:s.img||null,score:Math.round(r.score*100),label:r.data}); });
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='my_labels.json'; document.body.appendChild(a); a.click(); a.remove();
}

resetWork(); render();
</script>
